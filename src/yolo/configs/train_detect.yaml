export_openvino: false

task: detect
model: yolo26s.pt
data: exchange_detect_dataset.yaml
resume: null

train:
  epochs: 500
  batch: 66
  imgsz: 640
  device: "0"
  workers: 4
  lr0: 0.005
  patience: 1000
  optimizer: MuSGD
  save_period: 50
  plots: true
  verbose: true
  project: ../runs/detect
  name: yolo26s_detect_exchange

yolo_aug:
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.0
  degrees: 0.0
  translate: 0.08
  scale: 0.0
  shear: 0.0
  bgr: 0.3
  perspective: 0.0003
  flipud: 0.0
  fliplr: 0.3
  mosaic: 0.0
  mixup: 0.05
  cutmix: 0.0
  copy_paste: 0.0
  erasing: 0.2

loss:
  box: 7.5
  cls: 0.5
  dfl: 1.5

random_crop:
  _class_name: augmentations.RandomCrop
  enabled: true
  p: 0.35
  scale: [0.65, 1.0]
  min_bbox_area_ratio: 0.03

box_crop:
  _class_name: augmentations.RandomBoxCrop
  enabled: true
  p: 0.2
  target_classes: [1]
  scale: [1.4, 3.2]
  center_jitter: 0.15
  min_bbox_area_ratio: 0.05
  min_crop_size_ratio: 0.25

crop_choice:
  enabled: true
  p: 0.45
  weights:
    random_crop: 0.55
    box_crop: 0.45

random_occlusion:
  _class_name: augmentations.RandomOcclusion
  enabled: true
  p: 0.1
  holes: [1, 3]
  height: [0.04, 0.2]
  width: [0.04, 0.2]
  fill: 0
  random_fill_p: 0.2
  max_bbox_overlap: 0.4
  max_attempts: 20

albumentations:
  enabled: true
  transforms:
    GaussianBlur:
      _class_name: albumentations.GaussianBlur
      blur_limit: [3, 5]
      sigma_limit: [0.5, 3.0]
      p: 0.1
    MotionBlur:
      _class_name: albumentations.MotionBlur
      blur_limit: [3, 5]
      p: 0.1
    MedianBlur:
      _class_name: albumentations.MedianBlur
      blur_limit: 3
      p: 0.1
    AdvancedBlur:
      _class_name: albumentations.AdvancedBlur
      blur_limit: [3, 5]
      sigma_x_limit: [0.2, 1.0]
      sigma_y_limit: [0.2, 1.0]
      rotate_limit: [-90, 90]
      beta_limit: [0.8, 4.0]
      noise_limit: [0.95, 1.05]
      p: 0.1
    Defocus:
      _class_name: albumentations.Defocus
      radius: [3, 8]
      alias_blur: [0.1, 0.3]
      p: 0.1
    ChromaticAberration:
      _class_name: albumentations.ChromaticAberration
      primary_distortion_limit: [-0.01, 0.01]
      secondary_distortion_limit: [-0.02, 0.02]
      mode: red_blue
      p: 0.1
    RandomShadow:
      _class_name: albumentations.RandomShadow
      num_shadows_limit: [1, 3]
      p: 0.12
    PlasmaShadow:
      _class_name: albumentations.PlasmaShadow
      shadow_intensity_range: [0.2, 0.45]
      plasma_size: 256
      roughness: 2.5
      p: 0.08
    RandomBrightnessContrast:
      _class_name: albumentations.RandomBrightnessContrast
      brightness_limit: [-0.35, 0.35]
      contrast_limit: [-0.3, 0.3]
      p: 0.35
    AutoContrast:
      _class_name: albumentations.AutoContrast
      cutoff: 0.0
      method: cdf
      p: 0.08
    Equalize:
      _class_name: albumentations.Equalize
      mode: cv
      by_channels: true
      p: 0.1
    Downscale:
      _class_name: albumentations.Downscale
      scale_range: [0.4, 0.95]
      p: 0.18
    RandomFog:
      _class_name: albumentations.RandomFog
      fog_coef_range: [0.05, 0.25]
      p: 0.05
    CLAHE:
      _class_name: albumentations.CLAHE
      clip_limit: [1.0, 3.0]
      tile_grid_size: [8, 8]
      p: 0.1
    RandomGamma:
      _class_name: albumentations.RandomGamma
      gamma_limit: [75, 130]
      p: 0.25
    PlanckianJitter:
      _class_name: albumentations.PlanckianJitter
      mode: blackbody
      temperature_limit: [3000, 15000]
      sampling_method: uniform
      p: 0.3
    ChannelDropout:
      _class_name: albumentations.ChannelDropout
      channel_drop_range: [1, 1]
      fill: 0
      p: 0.05
    GaussNoise:
      _class_name: albumentations.GaussNoise
      std_range: [0.0110918711, 0.0248021777]
      mean_range: [0.0, 0.0]
      p: 0.2
    ISONoise:
      _class_name: albumentations.ISONoise
      color_shift: [0.01, 0.04]
      intensity: [0.08, 0.35]
      p: 0.18
    ShotNoise:
      _class_name: albumentations.ShotNoise
      scale_range: [0.06, 0.22]
      p: 0.12
    SaltAndPepper:
      _class_name: albumentations.SaltAndPepper
      amount: [0.002, 0.015]
      salt_vs_pepper: [0.4, 0.6]
      p: 0.04
    MultiplicativeNoise:
      _class_name: albumentations.MultiplicativeNoise
      multiplier: [0.95, 1.05]
      per_channel: false
      elementwise: false
      p: 0.08
    ImageCompression:
      _class_name: albumentations.ImageCompression
      quality_range: [25, 85]
      p: 0.25
    RingingOvershoot:
      _class_name: albumentations.RingingOvershoot
      blur_limit: [7, 13]
      cutoff: [0.8, 1.5]
      p: 0.12
    Posterize:
      _class_name: albumentations.Posterize
      num_bits: 6
      p: 0.05
    RandomToneCurve:
      _class_name: albumentations.RandomToneCurve
      scale: 0.15
      per_channel: false
      p: 0.12
    ColorJitter:
      _class_name: albumentations.ColorJitter
      brightness: 0.12
      contrast: 0.12
      saturation: 0.12
      hue: 0.04
      p: 0.12
    HueSaturationValue:
      _class_name: albumentations.HueSaturationValue
      hue_shift_limit: 15
      sat_shift_limit: 30
      val_shift_limit: 30
      p: 0.25
    RGBShift:
      _class_name: albumentations.RGBShift
      r_shift_limit: 8
      g_shift_limit: 8
      b_shift_limit: 8
      p: 0.08
    ChannelShuffle:
      _class_name: albumentations.ChannelShuffle
      p: 0.02
    Sharpen:
      _class_name: albumentations.Sharpen
      alpha: [0.1, 0.3]
      lightness: [0.7, 1.2]
      p: 0.08
    UnsharpMask:
      _class_name: albumentations.UnsharpMask
      blur_limit: [3, 5]
      sigma_limit: [0.2, 1.0]
      alpha: [0.1, 0.3]
      threshold: 10
      p: 0.08
  # Detection samples select at most one transform from each group.
  oneof_groups:
    - name: exposure_tone
      p: 0.35
      transforms: [RandomBrightnessContrast, RandomGamma, CLAHE, RandomToneCurve, AutoContrast, Equalize]
    - name: color_white_balance
      p: 0.30
      transforms: [PlanckianJitter, HueSaturationValue, ColorJitter, RGBShift, ChannelShuffle]
    - name: sensor_noise
      p: 0.25
      transforms: [GaussNoise, ISONoise, ShotNoise, SaltAndPepper, MultiplicativeNoise]
    - name: video_artifact
      p: 0.20
      transforms: [ImageCompression, Downscale, RingingOvershoot, Posterize]
    - name: focus_edge
      p: 0.18
      transforms: [GaussianBlur, MotionBlur, MedianBlur, AdvancedBlur, Defocus, Sharpen, UnsharpMask, ChromaticAberration]
    - name: lighting_scene
      p: 0.12
      transforms: [RandomShadow, PlasmaShadow, RandomFog]
